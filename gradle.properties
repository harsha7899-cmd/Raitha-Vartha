# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Disable KSP's automatic registration to comply with AGP 9.0 built-in Kotlin.
# We will handle registration manually in build.gradle.kts.
ksp.register.source.sets=false

# Re-enable Provider instances in SourceSet API for manual KSP registration
android.sourceset.disallowProvider=false

# Allow using sourceSets DSL with built-in Kotlin (fixes the specific error)
android.disallowKotlinSourceSets=false
